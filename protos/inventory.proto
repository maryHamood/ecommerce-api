syntax = "proto3";
option go_package = "inventory-service/protos";
package inventory;


service InventoryService {
//(Remote Procedure Call)
  rpc CheckStock (StockRequest) returns (StockResponse);


  rpc ReserveStock (ReserveRequest) returns (OperationResponse);


  rpc ReleaseStock (ReleaseRequest) returns (OperationResponse);


  rpc InitInventory (InitRequest) returns (OperationResponse);


  rpc DeleteInventory (DeleteRequest) returns (OperationResponse);
}



message StockRequest {
  string product_id = 1;
}

message StockResponse {
  int32 quantity = 1;
}

message ReserveRequest {
  string order_id = 1;
  repeated Item items = 2;
}

message Item {
  string product_id = 1;
  int32 quantity = 2;
}

message ReleaseRequest {
  string order_id = 1;
}

message InitRequest {
  string product_id = 1;
  int32 initial_quantity = 2;
}

message DeleteRequest {
  string product_id = 1;
}

message OperationResponse {
  bool success = 1;
  string message = 2;
}
