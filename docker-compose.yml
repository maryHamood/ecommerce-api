services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      inventory-service:
        condition: service_started
      redis:
        condition: service_started
      db_replica:
        condition: service_healthy
    extra_hosts:
      - "db:172.25.0.10"
      - "inventory-db:172.25.0.11"
      - "db_replica:172.25.0.12"
    networks:
      - ecommerce_network

  db:
    image: mysql:8.0
    command: sh -c "chmod 644 /etc/mysql/conf.d/replication.cnf && mysqld --skip-name-resolve"
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/master/my.cnf:/etc/mysql/conf.d/replication.cnf
    networks:
      ecommerce_network:
        ipv4_address: 172.25.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_replica:
    image: mysql:8.0
    command: sh -c "chmod 644 /etc/mysql/conf.d/replication.cnf && mysqld --skip-name-resolve"
    container_name: ecommerce_db_replica
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - db_replica_data:/var/lib/mysql
      - ./docker/mysql/replica/my.cnf:/etc/mysql/conf.d/replication.cnf
    networks:
      ecommerce_network:
        ipv4_address: 172.25.0.12
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce_network


  replica-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_replica_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db_replica
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db_replica:
        condition: service_healthy
    networks:
      - ecommerce_network


  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory_app
    restart: unless-stopped
    depends_on:
      inventory-db:
        condition: service_healthy
    environment:
      - DB_HOST=inventory-db
      - DB_USER=root
      - DB_PASS=${INVENTORY_DB_PASSWORD}
      - DB_NAME=inventory_db
    networks:
      - ecommerce_network

  inventory-db:
    image: mysql:8.0
    command: --skip-name-resolve
    container_name: inventory_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_ROOT_PASSWORD: ${INVENTORY_DB_PASSWORD}
    volumes:
      - inventory_data:/var/lib/mysql
    networks:
      ecommerce_network:
        ipv4_address: 172.25.0.11
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${INVENTORY_DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: inventory_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: inventory-db
      PMA_USER: root
      PMA_PASSWORD: ${INVENTORY_DB_PASSWORD}
    depends_on:
      - inventory-db
    networks:
      - ecommerce_network

  redis:
    image: redis:alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  db_data:
  db_replica_data:
  inventory_data:
